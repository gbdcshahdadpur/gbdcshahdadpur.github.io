<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Boys Degree College Shahdadpur Staff</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f4f7;
    text-align: center;
  }

  h1 {
    font-family: 'Georgia', serif;
    font-size: 2em;
    color: #2a5d84;
    margin: 20px 0;
  }

  .tree {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .level {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }

  .person {
    border: 2px solid #2a5d84;
    border-radius: 5px;
    background-color: #fff;
    width: 140px;
    padding: 10px;
    margin: 0 10px;
    text-align: center;
  }

  .photo {
    width: 100px;
    height: 120px;
    border: 2px solid #2a5d84;
    margin: 0 auto 5px auto;
    background-color: #e0e0e0;
  }

  small {
    display: block;
    font-weight: normal;
    color: #555;
    font-size: 0.85em;
    margin-top: 3px;
  }

  /* Connectors */
  .connector {
    height: 20px;
    border-left: 2px solid #2a5d84;
    margin: 0 auto;
  }
</style>
</head>
<body>

<h1>Government Boys Degree College Shahdadpur</h1>

<div class="tree">
  <!-- Superintendent -->
  <div class="person">
    <div class="photo"></div>
    Rahim Bux Lakho
    <small>Office Superintendent</small>
  </div>

  <div class="connector"></div>

  <!-- Office Assistants -->
  <div class="level">
    <div class="person">
      <div class="photo"></div>
      Mr. Waseem Baig
      <small>Office Assistant</small>
    </div>
    <div class="person">
      <div class="photo"></div>
      Tasleem Aziz
      <small>Office Assistant</small>
    </div>
  </div>

  <div class="connector"></div>

  <!-- Senior Clerk -->
  <div class="person">
    <div class="photo"></div>
    Ali Nawaz
    <small>Senior Clerk</small>
  </div>

  <div class="connector"></div>

  <!-- Junior Clerks -->
  <div class="level">
    <div class="person">
      <div class="photo"></div>
      Ghulam Mustafa
      <small>Junior Clerk</small>
    </div>
    <div class="person">
      <div class="photo"></div>
      Zia Habib Minhas
      <small>Junior Clerk</small>
    </div>
    <div class="person">
      <div class="photo"></div>
      Naeem Ahmed
      <small>Junior Clerk</small>
    </div>
  </div>
</div>

</body>
</html>
